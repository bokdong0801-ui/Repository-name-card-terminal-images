name: Create card terminal thumbnail

on:
  push:
    paths:
      - '.github/workflows/create-thumbnail.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-thumbnail:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create square thumbnail
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Path('images/card-terminal-part-5.jpg')
          image = Image.open(source).convert('RGB')
          width, height = image.size
          crop_size = min(width, height)
          thumbnail = image.crop((0, height - crop_size, crop_size, height))
          thumbnail = thumbnail.resize((1200, 1200), Image.Resampling.LANCZOS)
          thumbnail.save('images/card-terminal-thumbnail.jpg', 'JPEG', quality=90, optimize=True, progressive=True)
          PY

      - name: Commit thumbnail
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/card-terminal-thumbnail.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Add card terminal thumbnail'
            git push
          fi
